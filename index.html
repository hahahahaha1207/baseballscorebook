<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIAMOND | 야구 기록실</title>
<style>
:root{font-family:system-ui,"Noto Sans KR",sans-serif;color:#172338;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#142541;color:white;padding:24px max(18px,calc((100% - 1100px)/2))}.brand{font-size:24px;font-weight:900;letter-spacing:2px}.brand span{color:#80aaff}header p{margin:4px 0 0;color:#c3d0e3;font-size:12px}main{max-width:1100px;margin:22px auto;padding:0 16px 60px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.panel{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:0 0 15px;box-shadow:0 4px 15px #15254108}.panel h2{font-size:16px;margin:0 0 12px}.muted{color:#718096;font-size:12px}button{border:0;border-radius:8px;padding:9px 13px;font-weight:750;cursor:pointer;background:#edf2fa;color:#172338}.primary{background:#2864dc;color:white}.danger{color:#b42318;background:#fff0ef}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button.active{background:#142541;color:white}.fields{display:flex;gap:10px;flex-wrap:wrap}.fields label{font-size:11px;color:#718096;display:grid;gap:5px;flex:1;min-width:130px}input{min-width:0;width:100%;padding:8px;border:1px solid #dce3ed;border-radius:7px;font:inherit;color:#172338}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px;font-size:12px}th,td{padding:7px 6px;text-align:center;border-bottom:1px solid #e8edf4;white-space:nowrap}th{background:#f5f8fc;color:#617087;font-size:11px}td:first-child,th:first-child{text-align:left}td input{width:58px;text-align:center;padding:6px}td input.name{width:110px;text-align:left}.score{background:#142541;color:white;border-radius:11px;padding:12px;overflow:auto}.score table{color:white}.score th{background:#203757;color:#bdcce2}.score input{background:#203757;border-color:#466080;color:white;width:42px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.rankgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.rankgrid .panel{margin:0}.badge{display:inline-grid;place-items:center;background:#eaf0ff;color:#2454a8;border-radius:6px;width:22px;height:22px;font-weight:bold}.hidden{display:none!important}@media(max-width:720px){.grid,.rankgrid{grid-template-columns:1fr}header{padding:20px}main{margin-top:14px}.panel{padding:13px}}
@media print{.bar,.tabs,button{display:none!important}body{background:white}main{margin:0}.panel{box-shadow:none;break-inside:avoid}}
</style></head><body><header><div class="brand">⚾ DIAMOND<span>.</span></div><p>BASEBALL SCOREBOOK · 시즌 기록 관리</p></header><main>
<div class="bar"><button class="primary" id="mode">편집 모드</button><button class="game-action" id="save">현재 경기 저장</button><button class="game-action" id="load">저장 기록 불러오기</button><button class="game-action primary" id="archive">시즌에 경기 등록</button><button class="game-action" id="print">인쇄</button><button class="game-action danger" id="reset">새 경기</button></div>
<div class="tabs"><button class="active" data-tab="season">시즌 전체 순위</button><button data-tab="game">경기방</button></div>
<section id="game" class="hidden">
<div class="panel"><h2>경기 정보</h2><div class="fields"><label>날짜<input id="date" type="date"></label><label>홈 팀<input id="homeName" value="홈 팀"></label><label>원정 팀<input id="awayName" value="원정 팀"></label></div></div>
<div class="panel"><h2>이닝별 점수</h2><div class="score scroll"><table id="score"></table></div><p><button id="addInning">+ 이닝 추가</button></p></div>
<div class="grid"><div class="panel"><h2 id="homeTitle">홈 팀 타자</h2><div class="scroll"><table id="homeBat"></table></div><p><button id="addHome">+ 타자 추가</button></p></div><div class="panel"><h2 id="awayTitle">원정 팀 타자</h2><div class="scroll"><table id="awayBat"></table></div><p><button id="addAway">+ 타자 추가</button></p></div></div>
<div class="grid"><div class="panel"><h2 id="homePitchTitle">홈 팀 투수</h2><div class="scroll"><table id="homePit"></table></div><p><button id="addHomePit">+ 투수 추가</button></p></div><div class="panel"><h2 id="awayPitchTitle">원정 팀 투수</h2><div class="scroll"><table id="awayPit"></table></div><p><button id="addAwayPit">+ 투수 추가</button></p></div></div>
<div class="panel"><h2>현재 경기 순위</h2><div class="rankgrid" id="gameRanks"></div></div>
</section>
<section id="season"><div class="panel"><h2>시즌 누적 순위</h2><p class="muted" id="seasonCount">시즌에 등록된 경기 0개</p><div class="rankgrid" id="seasonRanks"></div></div><div class="panel"><h2>시즌 경기 목록</h2><div id="games"></div><button id="clearSeason" class="danger">시즌 기록 전체 삭제</button></div></section>
<p class="muted">※ 데이터는 이 브라우저에 저장됩니다. 다른 기기와 자동 동기화되지는 않습니다.</p></main>
<script>
const $=id=>document.getElementById(id), teams=['home','away'], batKeys=['pa','ab','h','d2','d3','hr','rbi','bb','so'],batLabels=['타석','타수','안타','2루타','3루타','홈런','타점','볼넷','삼진'],pitKeys=['outs','h','r','er','bb','so','w','l','sv'],pitLabels=['이닝(아웃)','피안타','실점','자책','볼넷','삼진','승','패','세이브'];
let edit=false, currentTab="season", innings=9, score={home:Array(9).fill(0),away:Array(9).fill(0)}, bat={home:[],away:[]},pit={home:[],away:[]},season=[];
const blankBat=()=>({name:'선수',pa:0,ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,bb:0,so:0}),blankPit=()=>({name:'투수',outs:0,h:0,r:0,er:0,bb:0,so:0,w:0,l:0,sv:0});
const num=v=>Math.max(0,Number(v)||0), sum=(a,k)=>a.reduce((s,p)=>s+num(p[k]),0), avg=p=>p.ab?(p.h/p.ab).toFixed(3).replace(/^0/,''):'.000', era=p=>p.outs?(p.er*27/p.outs).toFixed(2):'—', ip=p=>Math.floor(p.outs/3)+'.'+p.outs%3, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('date').value=new Date().toISOString().slice(0,10);
function input(v,kind,side,i,key){return '<input '+(kind==='name'?'class="name"':'type="number" min="0"')+' data-kind="'+kind+'" data-side="'+side+'" data-i="'+i+'" data-key="'+key+'" value="'+esc(v)+'" '+(!edit?'disabled':'')+'>'}
function renderScore(){let h='<tr><th>팀</th>'+Array.from({length:innings},(_,i)=>'<th>'+(i+1)+'</th>').join('')+'<th>R</th></tr>';teams.forEach(t=>{h+='<tr><td>'+esc($(t+'Name').value)+'</td>'+score[t].map((v,i)=>'<td><input type="number" min="0" data-score="'+t+'" data-in="'+i+'" value="'+v+'" '+(!edit?'disabled':'')+'></td>').join('')+'<td><b>'+sum(score[t].map(v=>({v} )),'v')+'</b></td></tr>'});$('score').innerHTML=h}
function renderRoster(t){let h='<tr><th>선수</th>'+batLabels.map(x=>'<th>'+x+'</th>').join('')+'<th>타율</th><th></th></tr>';bat[t].forEach((p,i)=>{h+='<tr><td>'+input(p.name,'name',t,i,'name')+'</td>'+batKeys.map(k=>'<td>'+input(p[k],'num',t,i,k)+'</td>').join('')+'<td>'+avg(p)+'</td><td>'+(edit?'<button data-delbat="'+t+'" data-i="'+i+'">삭제</button>':'')+'</td></tr>'});$(t+'Bat').innerHTML=h||'<tr><td colspan="12">선수 기록 없음</td></tr>';$(t+'Title').textContent=$(t+'Name').value+' 타자'}
function renderPitch(t){let h='<tr><th>투수</th>'+pitLabels.map(x=>'<th>'+x+'</th>').join('')+'<th>ERA</th><th></th></tr>';pit[t].forEach((p,i)=>{h+='<tr><td>'+input(p.name,'pname',t,i,'name')+'</td><td>'+input(ip(p),'ip',t,i,'outs')+'</td>'+pitKeys.slice(1).map(k=>'<td>'+input(p[k],'num',t,i,k)+'</td>').join('')+'<td>'+era(p)+'</td><td>'+(edit?'<button data-delpit="'+t+'" data-i="'+i+'">삭제</button>':'')+'</td></tr>'});$(t+'Pit').innerHTML=h||'<tr><td colspan="12">투수 기록 없음</td></tr>';$(t+'PitchTitle').textContent=$(t+'Name').value+' 투수'}
function rankBlock(title,arr,metric,fmt,reverse=false){let list=arr.filter(p=>metric(p)!==null).sort((a,b)=>reverse?metric(a)-metric(b):metric(b)-metric(a)).slice(0,10);return '<div class="panel"><h2>'+title+'</h2><div class="scroll"><table><tr><th>#</th><th>팀</th><th>선수</th><th>기록</th></tr>'+list.map((p,i)=>'<tr><td><span class="badge">'+(i+1)+'</span></td><td>'+esc(p.team)+'</td><td>'+esc(p.name)+'</td><td><b>'+fmt(p)+'</b></td></tr>').join('')+'</table></div></div>'}
function allBat(){return teams.flatMap(t=>bat[t].map(p=>({...p,team:$(t+'Name').value})))}
function allPit(){return teams.flatMap(t=>pit[t].map(p=>({...p,team:$(t+'Name').value})))}
function renderRanks(){let b=allBat(),p=allPit();$('gameRanks').innerHTML=rankBlock('타율 TOP 10',b,x=>x.ab?x.h/x.ab:null,avg)+rankBlock('홈런 TOP 10',b,x=>x.hr,x=>x.hr)+rankBlock('타점 TOP 10',b,x=>x.rbi,x=>x.rbi)+rankBlock('평균자책점 TOP 10',p,x=>x.outs?x.er*27/x.outs:null,era,true)+rankBlock('탈삼진 TOP 10',p,x=>x.so,x=>x.so)+rankBlock('다승 TOP 10',p,x=>x.w,x=>x.w)}
function snapshot(){return {date:$('date').value,names:{home:$('homeName').value,away:$('awayName').value},innings,score:structuredClone(score),bat:structuredClone(bat),pit:structuredClone(pit)}}
function renderSeason(){let b=[],p=[];season.forEach(g=>teams.forEach(t=>{g.bat[t].forEach(x=>b.push({...x,team:g.names[t]}));g.pit[t].forEach(x=>p.push({...x,team:g.names[t]}))}));function aggregate(rows,keys){let m={};rows.forEach(x=>{let id=x.team+'|'+x.name;m[id]??={...x};keys.forEach(k=>m[id][k]=num(m[id][k])+num(x[k]))});return Object.values(m)}let B=aggregate(b,batKeys),P=aggregate(p,pitKeys);$('seasonCount').textContent='시즌에 등록된 경기 '+season.length+'개';$('seasonRanks').innerHTML=rankBlock('타율 TOP 10',B,x=>x.ab?x.h/x.ab:null,avg)+rankBlock('안타 TOP 10',B,x=>x.h,x=>x.h)+rankBlock('홈런 TOP 10',B,x=>x.hr,x=>x.hr)+rankBlock('타점 TOP 10',B,x=>x.rbi,x=>x.rbi)+rankBlock('평균자책점 TOP 10',P,x=>x.outs?x.er*27/x.outs:null,era,true)+rankBlock('탈삼진 TOP 10',P,x=>x.so,x=>x.so)+rankBlock('다승 TOP 10',P,x=>x.w,x=>x.w)+rankBlock('세이브 TOP 10',P,x=>x.sv,x=>x.sv);$('games').innerHTML=season.map((g,i)=>'<p>'+esc(g.date)+' · '+esc(g.names.away)+' '+g.score.away.reduce((a,b)=>a+b,0)+' : '+g.score.home.reduce((a,b)=>a+b,0)+' '+esc(g.names.home)+' <button data-remove="'+i+'">삭제</button></p>').join('')||'<p class="muted">등록된 경기가 없습니다.</p>'}
function render(){renderScore();teams.forEach(t=>{renderRoster(t);renderPitch(t)});renderRanks();renderSeason();$('mode').textContent=edit?'편집 모드 ON':'보기 모드 ON';document.querySelectorAll('.game-action').forEach(el=>el.classList.toggle('hidden',currentTab!=='game'));document.querySelectorAll('.game-action,#game button,#game input').forEach(el=>{el.disabled=!edit});}
function persist(){localStorage.setItem('diamondCurrent',JSON.stringify(snapshot()));localStorage.setItem('diamondSeason',JSON.stringify(season))}
$('mode').onclick=()=>{if(edit){edit=false;render();return}const password=prompt('편집 모드 비밀번호를 입력하세요.');if(password===null)return;if(password==='0701'){edit=true;render()}else{alert('비밀번호가 올바르지 않습니다.');edit=false;render()}};
$('save').onclick=()=>{persist();alert('현재 경기와 시즌 기록을 이 브라우저에 저장했어요.')};
$('load').onclick=()=>{let d=localStorage.getItem('diamondCurrent');if(!d)return alert('저장된 기록이 없어요.');let g=JSON.parse(d);loadGame(g);season=JSON.parse(localStorage.getItem('diamondSeason')||'[]');render()};
function loadGame(g){innings=g.innings;score=g.score;bat=g.bat;pit=g.pit;$('date').value=g.date;teams.forEach(t=>$(t+'Name').value=g.names[t])}
$('archive').onclick=()=>{if(!confirm('현재 경기를 시즌 기록에 추가할까요? 중복 등록하면 기록도 중복 합산됩니다.'))return;season.push(snapshot());persist();renderSeason();alert('시즌에 등록했어요.')};
$('reset').onclick=()=>{if(!confirm('새 경기를 시작할까요?'))return;innings=9;score={home:Array(9).fill(0),away:Array(9).fill(0)};bat={home:[],away:[]};pit={home:[],away:[]};teams.forEach(t=>$(t+'Name').value=t==='home'?'홈 팀':'원정 팀');$('date').value=new Date().toISOString().slice(0,10);render()};
$('print').onclick=()=>print();
$('addInning').onclick=()=>{innings++;teams.forEach(t=>score[t].push(0));render()};
$('addHome').onclick=()=>{bat.home.push(blankBat());render()};$('addAway').onclick=()=>{bat.away.push(blankBat());render()};$('addHomePit').onclick=()=>{pit.home.push(blankPit());render()};$('addAwayPit').onclick=()=>{pit.away.push(blankPit());render()};
document.addEventListener('input',e=>{let d=e.target.dataset;if(d.score){score[d.score][+d.in]=num(e.target.value);renderScore();return}if(!d.kind)return;let row=(d.kind==='ip'?pit: d.kind==='pname'?pit:bat)[d.side][+d.i];if(d.kind==='ip'){let a=String(e.target.value).split('.');row.outs=num(a[0])*3+Math.min(2,num(a[1]||0))}else row[d.key]=d.kind==='name'||d.kind==='pname'?e.target.value:num(e.target.value);persist();renderRanks()});
document.addEventListener('click',e=>{let d=e.target.dataset;if(d.delbat){bat[d.delbat].splice(+d.i,1);render()}if(d.delpit){pit[d.delpit].splice(+d.i,1);render()}if(d.remove!==undefined){season.splice(+d.remove,1);persist();renderSeason()}});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('game').classList.toggle('hidden',currentTab!=='game');$('season').classList.toggle('hidden',currentTab!=='season');document.querySelectorAll('.game-action').forEach(el=>el.classList.toggle('hidden',currentTab!=='game'))});
$('clearSeason').onclick=()=>{if(confirm('시즌 기록을 모두 삭제할까요?')){season=[];persist();renderSeason()}};
teams.forEach(t=>$(t+'Name').oninput=()=>render());season=JSON.parse(localStorage.getItem('diamondSeason')||'[]');let saved=localStorage.getItem('diamondCurrent');if(saved){try{loadGame(JSON.parse(saved))}catch(e){}}render();
</script></body></html>
